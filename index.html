<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>نظام موضوعات المكتب التنفيذي ومجلس الإدارة — نادي الجزيرة الرياضي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#0d1f3c;--navy2:#1a3a6b;--gold:#c9a227;--gold2:#f0c94a;--bg:#f0f3f8;--soft:#f7f9fb;--border:#dde3eb;--text:#1a2333;--muted:#6b7c93;--red:#c0392b;--amber:#d97706;--green:#15803d}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:.86rem}
button,input,select,textarea{font-family:inherit;font-size:.84rem;color:var(--text)}
.gate{display:none;height:100vh;align-items:center;justify-content:center;background:linear-gradient(145deg,var(--navy),var(--navy2));padding:16px}
.box{background:#fff;border-radius:14px;border-top:5px solid var(--gold);padding:30px;width:100%;max-width:380px;text-align:center}
.box img{width:80px;height:80px;border-radius:50%;margin-bottom:8px}.box h1{font-size:1.1rem;color:var(--navy);font-weight:900}.box p{color:var(--muted);font-size:.8rem;margin-bottom:18px}
.box input{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:7px;margin-bottom:10px;background:#fff}
.err{display:none;background:#fee2e2;color:var(--red);padding:7px;border-radius:7px;font-size:.78rem;margin-bottom:10px}
.btn{padding:6px 15px;border-radius:6px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-p{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-g{background:var(--gold);border-color:var(--gold);color:var(--navy)}.btn.sm{padding:2px 10px;font-size:.72rem}.btn.red{color:var(--red);border-color:var(--red)}
.box .btn{width:100%;padding:9px}.tiny{background:none;border:none;color:var(--navy2);text-decoration:underline;cursor:pointer;margin-top:12px;font-size:.78rem}
#app{display:none;flex-direction:column;height:100vh}#app.on{display:flex}
#top{background:var(--navy);flex-shrink:0;display:flex;align-items:center;padding:6px 18px;gap:12px;border-bottom:2px solid rgba(201,162,39,.3);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;color:var(--gold2);font-weight:900}.brand img{width:36px;height:36px;border-radius:50%}
.tabs{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}.tab{background:transparent;border:none;color:rgba(255,255,255,.55);font-weight:600;padding:6px 14px;border-radius:6px;cursor:pointer}
.tab.on{background:rgba(201,162,39,.2);color:var(--gold2);border:1px solid rgba(201,162,39,.3)}
.who{color:rgba(255,255,255,.65);font-size:.74rem;display:flex;gap:8px;align-items:center}.who .btn{background:transparent;border-color:rgba(255,255,255,.25);color:rgba(255,255,255,.75);padding:2px 10px;font-size:.72rem}
.view{display:none;flex:1;overflow-y:auto;padding:20px 24px 40px}#v-topics{padding:0;overflow:hidden}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:0 1px 6px rgba(0,0,0,.05);margin-bottom:14px}
.card h3{font-size:.9rem;color:var(--navy);margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border)}.card h3::before{content:'◆ ';color:var(--gold);font-size:.6rem}
label{display:block;font-size:.74rem;color:var(--muted);margin-bottom:2px}.in,textarea{width:100%;padding:7px 9px;border:1px solid var(--border);border-radius:6px;background:#fff}textarea{min-height:90px;line-height:1.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px}.g5{grid-template-columns:repeat(5,1fr)}@media(max-width:700px){.g2,.g3,.g5{grid-template-columns:1fr}}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}.row b{flex:1;min-width:160px}
.tag{background:var(--bg);border-radius:10px;padding:1px 9px;font-size:.68rem;color:var(--muted)}.dp{padding:1px 8px;border-radius:10px;font-size:.65rem;font-weight:700;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:.8rem}th{background:var(--navy);color:#fff;padding:7px 8px;text-align:right}td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
#v-topics.on{display:flex}#sidebar{width:320px;background:#fff;border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.sbh{background:var(--navy);padding:12px 16px;color:var(--gold2);font-weight:800}.sbs{padding:8px 12px;border-bottom:1px solid var(--border);background:#fafbfc;display:grid;gap:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{padding:2px 10px;border-radius:20px;font-size:.68rem;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--muted)}.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#items{flex:1;overflow-y:auto}.ci{padding:10px 14px;border-bottom:1px solid var(--border);cursor:pointer;position:relative}.ci:hover{background:var(--soft)}.ci.on{background:#eff3ff;border-right:3px solid var(--navy)}
.ci .t{display:flex;gap:6px;align-items:center;font-size:.64rem;color:var(--muted);margin-bottom:2px;flex-wrap:wrap}.ci .n{font-size:.84rem;font-weight:600}.dot{position:absolute;left:12px;top:13px;width:9px;height:9px;border-radius:50%}
#panel{flex:1;overflow-y:auto}.tool{background:#fff;border-bottom:1px solid var(--border);padding:8px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;gap:8px;flex-wrap:wrap}.tool div{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:70px 20px}.empty div{font-size:3rem;opacity:.35}
.wrap{max-width:860px;margin:20px auto;padding:0 16px 60px}.paper{background:#fff;border:1px solid var(--border);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.07);overflow:hidden}
.fh{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;gap:12px}.fh img{width:52px;height:52px;border-radius:50%}.fh h1{font-size:1rem;color:var(--gold2)}.fh p{font-size:.74rem;color:rgba(255,255,255,.6)}
.fid{margin-right:auto;font-size:.73rem;color:rgba(255,255,255,.55);text-align:center}.fid strong{display:block;color:var(--gold2);font-size:1rem}
.fb{padding:2px 24px 24px}.sec{margin-top:20px}.sec h4{font-size:.8rem;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:4px;margin-bottom:10px}.sec h4::before{content:'◆ ';color:var(--gold);font-size:.55rem}
.fr{display:flex;gap:8px;margin-bottom:7px;align-items:baseline}.fl{font-weight:600;min-width:150px;flex-shrink:0}.fv{flex:1;border-bottom:1px solid var(--border);padding:1px 5px}
.ttl{font-weight:800;font-size:.95rem;margin-bottom:6px}.desc{border:1px solid var(--border);border-radius:3px;padding:8px 10px;line-height:1.85;background:#fafbfc;white-space:pre-wrap;min-height:50px}
.logb{background:#fef3c7;border:1px solid #f3d98a;color:#92400e;border-radius:4px;padding:6px 10px;margin-bottom:5px;font-size:.78rem}.lock{background:#e6f4ec;color:var(--green);padding:9px 12px;border-radius:6px}
.opt{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--border);border-radius:7px;margin-bottom:6px;cursor:pointer;color:var(--text);font-size:.86rem}.opt.on{border-color:var(--navy);background:#eff3ff;font-weight:700}.opt input{width:16px;height:16px}
.bdg{padding:1px 9px;border-radius:10px;color:#fff;font-size:.7rem;font-weight:700;white-space:nowrap}
#vw{display:none;position:fixed;inset:0;background:rgba(13,31,60,.93);z-index:90;flex-direction:column}.vwh{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:#fff;gap:10px;flex-wrap:wrap}.vwh a{text-decoration:none}.vwc{flex:1;width:100%;border:0;background:#fff}
#pa{display:none}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:8px;display:none;z-index:99}
@media(max-width:760px){#v-topics.on{flex-direction:column}#sidebar{width:100%;max-height:42%}.view{padding:12px}}
.ph{display:flex;align-items:center;gap:14px;border-bottom:3px double var(--navy);padding-bottom:10px;margin-bottom:14px}.ph img{width:74px;height:74px;border-radius:50%}.ph h1{font-size:1.25rem;color:var(--navy)}.ph h2{font-size:1rem}.ph p{font-size:.8rem;color:#555}
.pt{width:100%;border-collapse:collapse;margin-bottom:12px}.pt th,.pt td{border:1px solid #999;padding:6px 8px;color:#000;background:#fff;font-size:.85rem;text-align:right}.pt th{background:#e8ecf2;width:26%}.big{border:1px solid #999;padding:12px;line-height:2;white-space:pre-wrap;min-height:110px;margin-bottom:14px;font-size:.95rem}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 18px;margin-top:22px}.sg div{border-top:1px solid #000;padding-top:4px;text-align:center;font-size:.82rem;margin-top:34px}
@media print{@page{size:A4;margin:12mm}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}body{height:auto;overflow:visible;background:#fff}body>*:not(#pa){display:none!important}#pa{display:block!important;color:#000;font-size:12pt}}
</style>
</head>

    case 'exps':if(confDel==='x'+id){confDel=null;api('exportSession',{sessionId:id}).then(done('تم تصدير الموضوعات للأعضاء — يمكنك الآن طباعتها أو إرسالها بالبريد')).catch(fail)}else{confDel='x'+id;render(true)}break;
    case 'unexps':if(confDel==='u'+id){confDel=null;api('unexportSession',{sessionId:id}).then(done('تم إلغاء التصدير')).catch(fail)}else{confDel='u'+id;toast('اضغط «إلغاء التصدير» مرة أخرى للتأكيد')}break;
    case 'msess':if(X.busy)return;if(confDel!=='m'+id){confDel='m'+id;render(true);return}confDel=null;X.busy=true;toast('جاري الإرسال…');api('emailSession',{sessionId:id}).then(d=>{load();alert('تم الإرسال إلى '+d.sent+' عضو'+(d.missing.length?'\nبدون بريد إلكتروني (لم يصلهم): '+d.missing.join('، '):'')+(d.skipped?'\nبعض المرفقات لم تُرفق لكبر حجمها':''))}).catch(fail).finally(()=>{X.busy=false});break;
    case 'preport':printReport();break;
    case 'suser':{const f=X.uf;if(f.role==='member'){f.body=f.mbB&&f.mbE?'both':f.mbB?'board':f.mbE?'exec':'';if(!f.body)return toast('حدد عضوية واحدة على الأقل: المجلس أو المكتب التنفيذي')}else f.body='';api('saveUser',f).then(()=>{X.uf={role:'member',body:'',mbB:false,mbE:false};toast('تم الحفظ');load();render(true)}).catch(fail);break}
    case 'memb':X.uf[el.dataset.b==='board'?'mbB':'mbE']=el.checked;break;
    case 'smine':{const f=X.mf;if(!f.cur)return toast('اكتب كلمة المرور الحالية');if(f.pw&&f.pw.length<6)return toast('كلمة المرور الجديدة أقل من 6 أحرف');api('updateProfile',{name:f.name,current:f.cur,password:f.pw||''}).then(d=>{me.name=d.name;me.email=d.email;sessionStorage.setItem('bd_u',JSON.stringify(me));$('#wn').textContent=me.name+' — '+(me.title||ROLE[me.role]);X.mf=null;toast('تم حفظ بياناتك');render(true)}).catch(fail);break}
    case 'cuser':X.uf={role:'member',body:'',mbB:false,mbE:false};render(true);break;
    case 'euser':{const u=D.users.find(x=>x.uid===id);X.uf={uid:id,name:u.name,username:u.username,role:u.role==='member'?'member':'admin',body:u.body||'',mbB:u.body==='board'||u.body==='both',mbE:u.body==='exec'||u.body==='both',email:u.email||'',title:u.title||(u.role==='manager'?'المدير التنفيذي':u.role==='auditor'?'مدير إدارة المراجعة الداخلية':'')};render(true);scrollTo(0,0);break}
    case 'duser':if(confDel===id){confDel=null;api('deleteUser',{uid:id}).then(done('تم الحذف')).catch(fail)}else{confDel=id;toast('اضغط حذف مرة أخرى للتأكيد')}break;
    case 'sset':api('saveSettings',{depts:X.st.depts.split('\n').map(s=>s.trim()),sports:X.st.sports.split('\n').map(s=>s.trim()),cats:X.st.cats.split('\n').map(s=>s.trim()),link:X.st.link||''}).then(()=>{X.st=null;toast('تم حفظ القوائم');load()}).catch(fail);break;
  }
});
function setv(e){const d=e.target.dataset;if(!d.o)return;if(d.o==='dr')X.dr[d.k]=d.k.startsWith('dec')?e.target.value:Object.assign(X.dr[d.k]||{},{n:e.target.value});else{X[d.o][d.k]=e.target.value;if(d.o==='uf'&&d.k==='role')X.uf.title=''}}
document.addEventListener('input',setv);
document.addEventListener('change',e=>{setv(e);if(e.target.dataset.r)render(true);if(e.target.id==='fcat'){X.fc=e.target.value;side()}});
document.addEventListener('focusout',()=>setTimeout(()=>{if(pending&&!typing())render(true)},80));
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('#login').style.display==='flex'&&e.target.id&&e.target.id.startsWith('l'))doLogin()});
</script>
</body>
</html>
